[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
repository = "https://github.com/hydro-project/infinity-slack"

[workspace.dependencies]
# The Infinity daemon's client protocol. Tracked by pinned git revision of
# hydro-project/infinity (see AGENTS.md, "Tracking infinity").
infinity-protocol = { git = "https://github.com/hydro-project/infinity", rev = "97dee40b3631f1c03193cb93cca74e4e2990d549" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "sync"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "ansi"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "default-tls", "multipart", "stream"] }

[workspace.lints.rust]
impl_trait_overcaptures = "warn"
missing_unsafe_on_extern = "deny"
unsafe_attr_outside_unsafe = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
alloc_instead_of_core = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# `#[async_trait]` expands trait methods to return boxed futures and tags them
# `#[must_use]`, tripping this lint on every such trait (clippy 1.99+).
double_must_use = "allow"
explicit_into_iter_loop = "warn"
let_and_return = "allow"
manual_is_variant_and = "warn"
manual_let_else = "warn"
redundant_clone = "warn"
self_named_module_files = "warn"
str_to_string = "warn"
try_err = "warn"
uninlined_format_args = "allow"
unused_async = "warn"
unwrap_used = "warn"
